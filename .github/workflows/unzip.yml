
name: Extract PolyTrack ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "youxi.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract game files
        run: |
          set -eu

          if [ ! -f "youxi.zip" ]; then
            echo "ERROR: 根目录中找不到 youxi.zip"
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted
          unzip -oq youxi.zip -d extracted

          SOURCE=$(find extracted -type f -name index.html -print -quit)

          if [ -z "$SOURCE" ]; then
            echo "ERROR: 压缩包中找不到 index.html"
            exit 1
          fi

          ROOT=$(dirname "$SOURCE")
          cp -a "$ROOT"/. .
          rm -rf extracted

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract PolyTrack game files" || exit 0
          git push
