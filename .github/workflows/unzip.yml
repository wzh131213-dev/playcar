- name: youxi.zip
  # You may pin to the exact commit or the version.
  # uses: naiyniB/WorkFlow-Unzip-Deploy@19f40b5cadeb3879bed9023fb27b6014e450236c
  uses: naiyniB/WorkFlow-Unzip-Deploy@v0.0.1-alpha
  with:
    # zip 文件所在的文件夹路径，默认是 public
    File_directory: # optional, default is public
    # 在默认保留项（.git|.github|public|temp）基础上，额外保留的文件或文件夹（用 | 分隔）。
例如填写：CNAME|README.md，则最终保留项为 .git|.github|public|temp|CNAME|README.md

    exclude_files: # optional, default is 
    # 是否删除 zip 目录? true 或 false 默认是删除
    delete_zip_directory: # optional, default is true
