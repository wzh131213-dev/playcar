name: PlayCar Physics Engine tests

on:
  push:
    branches: [main, "feature/**", "arena/**"]
  pull_request:
    branches: [main]

jobs:
  physics-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Rebuild the single-file bundle
        run: npm run build

      - name: The bundle must match the sources
        run: git diff --exit-code physics/playcar-physics-all-in-one.js

      - name: Syntax check every physics module
        run: for f in physics/*.js; do node --check "$f"; done

      - name: Syntax check every inline script on the lab page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("No inline scripts found in index.html")
          for i, script in enumerate(scripts):
              Path(f"/tmp/playcar-inline-{i}.js").write_text(script, encoding="utf-8")
          print(f"extracted {len(scripts)} inline script(s)")
          PY
          for f in /tmp/playcar-inline-*.js; do node --check "$f"; done

      - name: Run physics tests
        run: npm test

      - name: Benchmark the solver and vehicle
        run: npm run bench
