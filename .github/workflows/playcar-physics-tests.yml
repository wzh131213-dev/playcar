name: PlayCar Physics Engine tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  physics-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check engine
        run: node --check physics/playcar-physics-engine.js
      - name: Run regression scenarios
        run: node --test tests/playcar-physics.test.js
