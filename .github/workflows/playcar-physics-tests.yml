name: PlayCar Physics Engine tests

on:
  push:
    branches: [main, "feature/**", "arena/**"]
  pull_request:
    branches: [main]

jobs:
  physics-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Rebuild the single-file bundle
        run: npm run build

      - name: The bundle must match the sources
        run: git diff --exit-code physics/playcar-physics-all-in-one.js

      - name: Syntax check every physics module
        run: for f in physics/*.js; do node --check "$f"; done

      - name: Syntax check every inline script on the lab pages
        run: |
          rm -f /tmp/playcar-inline-*.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          count = 0
          for page in ["index.html", "test-scene.html"]:
              html = Path(page).read_text(encoding="utf-8")
              scripts = [s for s in re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S) if s.strip()]
              if not scripts:
                  raise SystemExit(f"No inline scripts found in {page}")
              stem = page.replace(".html", "").replace("/", "-")
              for i, script in enumerate(scripts):
                  Path(f"/tmp/playcar-inline-{stem}-{i}.js").write_text(script, encoding="utf-8")
                  count += 1
          print(f"extracted {count} inline script(s)")
          PY
          for f in /tmp/playcar-inline-*.js; do node --check "$f"; done

      - name: Run physics tests
        run: npm test

      - name: Benchmark the solver and vehicle
        run: npm run bench
