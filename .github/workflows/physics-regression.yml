name: Physics regression tests
on:
  push:
    branches:
      - feature/playcar-3d-stunt-track-tuning
  pull_request:
    branches:
      - feature/playcar-3d-stunt-track-tuning
  workflow_dispatch:
jobs:
  physics-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/physics-regression.test.js
