name: Physics regression tests
on:
  push:
    branches:
      - feature/playcar-3d-stunt-track-tuning
      - "arena/**"
  pull_request:
    branches:
      - main
      - feature/playcar-3d-stunt-track-tuning
  workflow_dispatch:
jobs:
  physics-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm run build
      - run: npm test
