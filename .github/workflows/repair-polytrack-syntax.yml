name: Repair PolyTrack JavaScript syntax

on:
  push:
    paths:
      - ".github/workflows/repair-polytrack-syntax.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Repair malformed leaderboard-disabled methods
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const file = 'main.bundle.js';
          let source = fs.readFileSync(file, 'utf8');
          const broken = 'Af.set(this,"v6/")}}getLeaderboard(){return Promise.reject(new Error("Leaderboard disabled"))}}getLeaderboardUserEntry(){return Promise.reject(new Error("Leaderboard disabled"))}getRecordings(e){';
          const fixed = 'Af.set(this,"v6/")}getLeaderboard(){return Promise.reject(new Error("Leaderboard disabled"))}getLeaderboardUserEntry(){return Promise.reject(new Error("Leaderboard disabled"))}getRecordings(e){';
          const count = source.split(broken).length - 1;
          if (count !== 1) throw new Error(`Expected exactly one malformed method sequence, found ${count}; refusing to modify the bundle.`);
          fs.writeFileSync(file, source.replace(broken, fixed));
          console.log('Repaired the malformed class method boundaries.');
          NODE

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          if node --check main.bundle.js >/tmp/syntax.log 2>&1; then
            echo "JavaScript syntax validation passed."
          else
            tail -n 3 /tmp/syntax.log
            exit 1
          fi

      - name: Commit repaired bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.bundle.js
          git commit -m "Fix PolyTrack leaderboard method syntax"
          git push
