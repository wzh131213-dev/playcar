<div id="brand">POLY<span>RUSH</span><div id="hint">LOW-POLY CIRCUIT · TIME ATTACK</div></div>
<div id="progressWrap"><div id="progressText">LAP 01 / 03</div><div id="progress"><div id="bar"></div></div></div>
<div id="hud"><div class="panel"><div class="lab">SPEED</div><div class="val" id="speed">000</div><div class="unit">KM/H</div></div><div class="panel"><div class="lab">TIME</div><div class="val" id="time">00:00.00</div><div class="unit">BEST <span id="best">--:--.--</span></div></div></div>

<div id="overlay"><div class="hero"><div class="eyebrow">A NEW GENERATION OF ARCADE RACING</div><h1>POLY<em>RUSH</em></h1><p>冲上高架、飞越坡道，在起伏弯道中挑战最快圈速。原创低多边形 3D 赛道，支持键盘和 iPad 触屏操作。</p><button class="primary" id="start">开始比赛　→</button><div class="keys"><span>W / ↑ 加速</span><span>S / ↓ 刹车</span><span>A D / ← → 转向</span><span>空格 手刹</span></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
if(!window.THREE){$('overlay').querySelector('p').textContent='3D 引擎加载失败，请检查网络后刷新页面。';return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bcfe7);scene.fog=new THREE.Fog(0x9bcfe7,100,330);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,900);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe8f7ff,0x526b47,2.15));const sun=new THREE.DirectionalLight(0xfff2d6,3.0);sun.position.set(-55,95,35);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-120;sun.shadow.camera.right=120;sun.shadow.camera.top=120;sun.shadow.camera.bottom=-120;scene.add(sun);
const mat=(color,roughness=.85)=>new THREE.MeshStandardMaterial({color,roughness,flatShading:true});
const grassMat=mat(0x65a86a),roadMat=mat(0x363d49),edgeMat=mat(0xf4f3e8),redMat=mat(0xf04b3d,.45),darkMat=mat(0x17232f,.6),glassMat=new THREE.MeshStandardMaterial({color:0x83dce8,metalness:.2,roughness:.25}),tireMat=mat(0x10151c),yellowMat=mat(0xffd45a),whiteMat=mat(0xf7f8f0);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1100,1100),grassMat);ground.rotation.x=-Math.PI/2;ground.position.y=-18;ground.receiveShadow=true;scene.add(ground);
const N=720, points=[], widths=[];for(let i=0;i<N;i++){const t=i/N*Math.PI*2;const x=Math.sin(t)*90+Math.sin(3*t)*20;const z=Math.cos(t)*115+Math.sin(2*t)*18;const y=2+Math.sin(3*t+.5)*8+Math.sin(7*t)*2.5;points.push(new THREE.Vector3(x,y,z));widths.push(13)}
const curve=new THREE.CatmullRomCurve3(points,true,'catmullrom',.28);const samples=curve.getPoints(N);const tangents=samples.map((p,i)=>samples[(i+1)%N].clone().sub(samples[(i-1+N)%N]).normalize());const sideVectors=tangents.map(t=>new THREE.Vector3(-t.z,0,t.x).normalize());
function roadMesh(offset,width,material,yOffset=0){const verts=[],uv=[],idx=[];for(let i=0;i<=N;i++){const j=i%N,p=samples[j],side=sideVectors[j];const a=p.clone().addScaledVector(side,offset-width/2);const b=p.clone().addScaledVector(side,offset+width/2);a.y+=yOffset;b.y+=yOffset;verts.push(a.x,a.y,a.z,b.x,b.y,b.z);uv.push(0,i/N*80,1,i/N*80);if(i<N){const k=i*2;idx.push(k,k+1,k+2,k+1,k+3,k+2)}}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();const m=new THREE.Mesh(g,material);m.receiveShadow=true;m.castShadow=false;scene.add(m);return m}
roadMesh(0,13,roadMat,.1);roadMesh(-6.8,.48,edgeMat,.17);roadMesh(6.8,.48,edgeMat,.17);
const dashMat=mat(0xf8f6dd);for(let i=0;i<N;i+=8){const p=samples[i],s=sideVectors[i];const g=new THREE.BoxGeometry(.16,.045,1.6);const dash=new THREE.Mesh(g,dashMat);dash.position.set(p.x,p.y+.25,p.z);dash.rotation.y=Math.atan2(tangents[i].x,tangents[i].z);scene.add(dash)}
// Decorative low-poly hills, trees and trackside markers
for(let i=0;i<220;i++){const j=(i*37)%N,p=samples[j],side=sideVectors[j],sgn=i%2?1:-1,dist=18+(i*13)%45;const pos=p.clone().addScaledVector(side,sgn*dist);const h=5+(i*17)%15;const tree=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.45,.7,h*.45,5),mat(0x76533b));trunk.position.y=h*.22;tree.add(trunk);const crown=new THREE.Mesh(new THREE.ConeGeometry(2.5+(i%3),h*.7,5),mat(i%3===0?0x2f744b:0x438b55));crown.position.y=h*.72;tree.add(crown);tree.position.set(pos.x,p.y-1,pos.z);tree.rotation.y=i*2.4;scene.add(tree)}
// Track gantries and glowing checkpoint beacons
function makeGate(idx,label){const p=samples[idx],tan=tangents[idx],side=sideVectors[idx],g=new THREE.Group();const postMat=mat(0x202b39,.4);for(const x of [-7.1,7.1]){const post=new THREE.Mesh(new THREE.BoxGeometry(.55,6,.55),postMat);post.position.set(x,3,0);g.add(post)}const beam=new THREE.Mesh(new THREE.BoxGeometry(14.7,.7,.65),yellowMat);beam.position.y=6;g.add(beam);for(let x=-5;x<=5;x+=2.5){const lamp=new THREE.Mesh(new THREE.BoxGeometry(.8,.22,.15),whiteMat);lamp.position.set(x,6,.38);g.add(lamp)}g.position.set(p.x,p.y,p.z);g.rotation.y=Math.atan2(tan.x,tan.z);scene.add(g)}
makeGate(0,'START');makeGate(240,'CHECK');makeGate(480,'CHECK');
const car=new THREE.Group();const chassis=new THREE.Mesh(new THREE.BoxGeometry(2.05,.62,4.1),redMat);chassis.position.y=.72;chassis.castShadow=true;car.add(chassis);
const nose=new THREE.Mesh(new THREE.BoxGeometry(1.72,.27,1.25),redMat);nose.position.set(0,.95,-1.35);car.add(nose);
const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.4,.67,1.65),glassMat);cabin.position.set(0,1.23,.05);cabin.castShadow=true;car.add(cabin);
const roof=new THREE.Mesh(new THREE.BoxGeometry(1.22,.12,.9),darkMat);roof.position.set(0,1.6,.08);car.add(roof);
for(const x of [-.78,.78]){for(const z of [-1.42,1.35]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.28,10),tireMat);wheel.rotation.z=Math.PI/2;wheel.position.set(x,.48,z);wheel.castShadow=true;car.add(wheel)}}
for(const x of [-.65,.65]){const lamp=new THREE.Mesh(new THREE.BoxGeometry(.36,.17,.12),yellowMat);lamp.position.set(x,.78,-2.08);car.add(lamp);const tail=new THREE.Mesh(new THREE.BoxGeometry(.4,.13,.1),mat(0xff3327));tail.position.set(x,.76,2.08);car.add(tail)}
scene.add(car);
const keys={left:false,right:false,gas:false,brake:false,hand:false};let running=false,paused=false,startedAt=0,elapsed=0,last=performance.now(),speed=0,progress=0,lateral=0,lateralVelocity=0,lap=1,camMode=0,best=Number(localStorage.getItem('polyrush-best')||0),yaw=0,nearestIndex=0,previousProgress=0;
function fmt(s){if(!isFinite(s)||s<=0)return '00:00.00';const m=Math.floor(s/60),sec=(s%60).toFixed(2).padStart(5,'0');return String(m).padStart(2,'0')+':'+sec}
$('best').textContent=best?fmt(best):'--:--.--';
function findRoadPosition(x,z){let bestIndex=0,bestDist=Infinity;for(let i=0;i<N;i++){const dx=x-samples[i].x,dz=z-samples[i].z,d=dx*dx+dz*dz;if(d<bestDist){bestDist=d;bestIndex=i}}return bestIndex}
function reset(){speed=0;progress=0;lateral=0;lateralVelocity=0;headingError=0;trackDistance=0;lap=1;elapsed=0;nearestIndex=0;previousProgress=0;const p=samples[0],tan=tangents[0];yaw=Math.atan2(tan.x,tan.z);car.position.set(p.x,p.y+.25,p.z);car.rotation.set(0,yaw,0);startedAt=performance.now();$('bar').style.width='0%';$('progressText').textContent='LAP 01 / 03';$('speed').textContent='000';$('time').textContent='00:00.00'}
// Physics rewrite: track-space dynamics, separate forward speed, lateral slip, and heading error.
const PHYS = {
  maxSpeed: 78,             // m/s-like game units; HUD converts to km/h
  engineForce: 31,
  brakeForce: 58,
  rollingDrag: 0.16,
  coastDrag: 0.48,
  aeroDrag: 0.0028,
  steerRate: 1.05,
  highSpeedSteer: 0.62,
  headingReturn: 1.35,
  lateralGrip: 4.8,
  driftGrip: 1.45,
  offroadGrip: 2.2,
  offroadSpeedLoss: 0.72,
  roadHalfWidth: 5.55
};
let lateralVelocity = 0;
let headingError = 0;
let trackDistance = 0;
function placeCar(){
  const p=samples[nearestIndex], side=sideVectors[nearestIndex];
  lateral=THREE.MathUtils.clamp(lateral,-PHYS.roadHalfWidth,PHYS.roadHalfWidth);
  car.position.set(p.x+side.x*lateral,p.y+.22,p.z+side.z*lateral);
  const roadYaw=Math.atan2(tangents[nearestIndex].x,tangents[nearestIndex].z);
  yaw=roadYaw+headingError;
  car.rotation.set(0,yaw,THREE.MathUtils.clamp(-lateralVelocity*.function update(dt){
if(running&&!paused){
  elapsed=(performance.now()-startedAt)/1000;
  // Arcade vehicle dynamics: throttle/brake change longitudinal speed; steering changes heading;
  // lateral velocity is damped by tire grip and becomes looser under handbrake.
  const throttle=keys.gas?1:0, braking=(keys.brake?1:0), handbrake=keys.hand?1:0;
  const maxSpeed=78, acceleration=throttle?31:0, serviceBrake=braking?48:0, drag=throttle?0.10:0.42;
  speed+=acceleration*dt;
  speed-=serviceBrake*dt;
  speed-=speed*drag*dt;
  if(handbrake) speed-=speed*0.34*dt;
  speed=THREE.MathUtils.clamp(speed,0,maxSpeed);

  const steering=(keys.right?1:0)-(keys.left?1:0);
  const speed01=THREE.MathUtils.clamp(speed/32,0,1);
  // Steering response grows with speed but softens at very high speed, avoiding instant spin-outs.
  const yawRate=(0.30+speed01*0.78)*(1-speed01*0.20);
  yaw+=steering*yawRate*dt*(handbrake?1.32:1);
  const forward=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
  const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));

  // Tire lateral grip: turning builds side slip; normal grip recenters it quickly.
  // Handbrake reduces grip to create a controllable arcade drift.
  const grip=handbrake?1.05:5.8;
  lateralVelocity+=steering*speed*(handbrake?0.58:0.20)*dt;
  lateralVelocity*=Math.exp(-grip*dt);
  const vx=forward.x*speed+right.x*lateralVelocity;
  const vz=forward.z*speed+right.z*lateralVelocity;
  car.position.x+=vx*dt;
  car.position.z+=vz*dt;

  nearestIndex=findRoadPosition(car.position.x,car.position.z);
  const center=samples[nearestIndex],side=sideVectors[nearestIndex],trackForward=tangents[nearestIndex];
  const dx=car.position.x-center.x,dz=car.position.z-center.z;
  lateral=dx*side.x+dz*side.z;
  // Solid road boundaries. Hitting an edge loses speed and lateral momentum instead of falling through.
  const edgeLimit=5.55;
  if(Math.abs(lateral)>edgeLimit){
    lateral=Math.sign(lateral)*edgeLimit;
    speed*=0.72;
    lateralVelocity*=0.28;
    car.position.x=center.x+side.x*lateral;
    car.position.z=center.z+side.z*lateral;
  }

  // Keep the chassis attached to the sampled solid road surface and follow its slope.
  const next=samples[(nearestIndex+1)%N],prev=samples[(nearestIndex-1+N)%N];
  const grade=Math.atan2(next.y-prev.y,Math.max(0.01,next.distanceTo(prev)));
  const tangentYaw=Math.atan2(trackForward.x,trackForward.z);
  const headingError=Math.atan2(Math.sin(yaw-tangentYaw),Math.cos(yaw-tangentYaw));
  car.position.y=center.y+0.25;
  car.rotation.set(grade, yaw, THREE.MathUtils.clamp(-steering*speed01*0.11-lateralVelocity*0.008,-0.22,0.22));

  const nowProgress=nearestIndex/N;
  if(previousProgress>.82&&nowProgress<.18){
    lap++;
    if(lap>3){
      running=false;speed=0;
      if(!best||elapsed<best){best=elapsed;localStorage.setItem('polyrush-best',best);$('best').textContent=fmt(best)}
      $('overlay').classList.remove('hidden');
      $('overlay').querySelector('.eyebrow').textContent='FINISH · PERSONAL TIME';
      $('overlay').querySelector('h1').innerHTML='RACE <em>COMPLETE</em>';
      $('overlay').querySelector('p').textContent='完赛时间 '+fmt(elapsed)+'。再跑一圈，挑战你的个人纪录！';
      $('start').textContent='再跑一次　→';lap=3;
    }
  }
  previousProgress=nowProgress;progress=nowProgress;
  $('speed').textContent=String(Math.round(speed*2.4)).padStart(3,'0');
  $('time').textContent=fmt(elapsed);
  $('bar').style.width=(progress*100)+'%';
  $('progressText').textContent='LAP '+String(Math.min(lap,3)).padStart(2,'0')+' / 03';
}
const p=car.position.clone(),forward=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
let desired,look;
if(camMode===0){desired=p.clone().addScaledVector(forward,-11-speed*.035);desired.y+=5.2+speed*.015;look=p.clone().addScaledVector(forward,7);look.y+=1.2}
else{desired=p.clone().add(new THREE.Vector3(0,22,0));look=p.clone()}
camera.position.lerp(desired,1-Math.exp(-dt*4.2));camera.lookAt(look);
}
a.lookAt(look);
}
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.04);last=now;update(dt);renderer.render(scene,camera)}requestAnimationFrame(animate);
function start(){reset();running=true;paused=false;$('pause').textContent='Ⅱ 暂停';$('overlay').classList.add('hidden')}
$('start').addEventListener('click',start);$('restart').addEventListener('click',()=>{reset();running=true;paused=false});$('pause').addEventListener('click',()=>{if(!running)return;paused=!paused;if(!paused)startedAt=performance.now()-elapsed*1000;$('pause').textContent=paused?'▶ 继续':'Ⅱ 暂停'});$('camera').addEventListener('click',()=>{camMode=(camMode+1)%2;$('camera').textContent=camMode?'相机：俯视':'相机：追尾'});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' ','w','a','s','d'].includes(k))e.preventDefault();if(k==='arrowup'||k==='w')keys.gas=true;if(k==='arrowdown'||k==='s')keys.brake=true;if(k==='arrowleft'||k==='a')keys.left=true;if(k==='arrowright'||k==='d')keys.right=true;if(k===' ')keys.hand=true;if(k==='r'){$('restart').click()}if(k==='c')$('camera').click();if(k==='escape')$('pause').click()},{passive:false});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowup'||k==='w')keys.gas=false;if(k==='arrowdown'||k==='s')keys.brake=false;if(k==='arrowleft'||k==='a')keys.left=false;if(k==='arrowright'||k==='d')keys.right=false;if(k===' ')keys.hand=false});
document.querySelectorAll('.touchbtn').forEach(el=>{const key=el.dataset.key;const on=e=>{e.preventDefault();keys[key]=true;el.classList.add('active')},off=e=>{e.preventDefault();keys[key]=false;el.classList.remove('active')};el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off)});
addEventListener('blur',()=>{Object.keys(keys).forEach(k=>keys[k]=false)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});
camera.position.set(0,16,28);camera.lookAt(0,0,0);placeCar();
})();
