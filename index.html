<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07101d"><title>PlayCar 3D — Original Track Racer</title>
<style>
:root{color-scheme:dark;--cyan:#6df7ff;--panel:#071525dd}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#f3f8ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;outline:0}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:env(safe-area-inset-top,10px);left:12px;right:12px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.brand,.stats,.hint,.menu{background:var(--panel);border:1px solid #7cefff35;box-shadow:0 8px 30px #0005;backdrop-filter:blur(12px);border-radius:14px}.brand{padding:10px 14px}.brand b{display:block;letter-spacing:2px;font-size:14px}.brand small{color:#93b9c9;font-size:10px;letter-spacing:1.5px}.stats{padding:9px 13px;display:flex;gap:18px}.stat small{display:block;color:#93b9c9;font-size:9px;letter-spacing:1px}.stat strong{font-size:19px;font-variant-numeric:tabular-nums}.stat em{font-size:10px;color:var(--cyan);font-style:normal}.hint{position:absolute;top:82px;left:50%;transform:translateX(-50%);padding:7px 12px;color:#c7e5ed;font-size:11px;white-space:nowrap}.controls{position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:end}.cluster{display:flex;gap:9px;align-items:end}.ctrl{pointer-events:auto;touch-action:none;border:1px solid #a6f5ff65;background:#0a1b2dcc;color:white;border-radius:18px;min-width:64px;height:62px;font-weight:800;font-size:13px;box-shadow:inset 0 0 18px #4defff13,0 8px 20px #0005;user-select:none;-webkit-user-select:none}.ctrl:active,.ctrl.down{background:#19b7c6bb;transform:scale(.96)}.ctrl.gas{height:76px;min-width:76px;border-color:#79ffbd88;background:#0b4539dd}.ctrl.brake{height:64px;background:#48242ddd;border-color:#ff8b9b66}.ctrl span{display:block;font-size:9px;font-weight:500;color:#b6d7df;margin-top:3px}.menu{pointer-events:auto;position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 32px));padding:25px;text-align:center}.menu h1{font-size:clamp(27px,7vw,42px);margin:0 0 5px;letter-spacing:2px}.menu p{color:#a9c7d3;font-size:13px;line-height:1.6}.menu button{pointer-events:auto;background:linear-gradient(110deg,#6df7ff,#a2ffd0);color:#07101d;border:0;border-radius:12px;padding:13px 23px;font-size:14px;font-weight:900;letter-spacing:1px;margin-top:8px}.menu .secondary{background:#172d40;color:#e8fbff;border:1px solid #5ee7ff44;margin-left:6px}.hidden{display:none!important}.progress{position:absolute;left:12px;right:12px;bottom:0;height:3px;background:#fff2}.progress i{display:block;height:100%;width:0;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}@media(min-width:800px){.controls{left:24px;right:24px}.ctrl{min-width:70px}.hint{top:90px}}
</style></head><body>
<div id="game"></div><div class="hud"><div class="top"><div class="brand"><b>PLAYCAR <span style="color:#6df7ff">3D</span></b><small>ORIGINAL TRACK RACER</small></div><div class="stats"><div class="stat"><small>SPEED</small><strong id="speed">000</strong> <em>KM/H</em></div><div class="stat"><small>TIME</small><strong id="time">00:00.0</strong></div><div class="stat"><small>LAP</small><strong id="lap">0/1</strong></div></div></div><div id="hint" class="hint">WASD / 方向键驾驶 · 空格手刹 · 触屏也可操作</div><div id="menu" class="menu"><h1>PLAYCAR <span style="color:#6df7ff">3D</span></h1><p>原创低多边形 3D 竞速体验<br>高速弯道 · 起伏路面 · 跳台 · 检查点<br>建议横屏游玩，触屏控制已适配 iPad。</p><button id="start">开始驾驶</button><button id="reset" class="secondary">重置赛道</button></div><div class="controls"><div class="cluster"><button class="ctrl" data-key="left">◀<span>左转</span></button><button class="ctrl" data-key="right">▶<span>右转</span></button></div><div class="cluster"><button class="ctrl brake" data-key="brake">刹车<span>减速 / 漂移</span></button><button class="ctrl gas" data-key="gas">加速<span>按住前进</span></button></div></div><div class="progress"><i id="bar"></i></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);const root=$('game');
if(!window.THREE){$('menu').classList.remove('hidden');$('menu').querySelector('p').textContent='3D 引擎加载失败。请检查网络后刷新页面。';return}
const THREE=window.THREE,scene=new THREE.Scene();scene.background=new THREE.Color(0x91c9df);scene.fog=new THREE.Fog(0x91c9df,90,360);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,900);camera.position.set(0,7,-12);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd8f5ff,0x4a604c,2.1));const sun=new THREE.DirectionalLight(0xfff3d8,2.5);sun.position.set(-45,75,-20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(color,roughness=.8,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const grass=mat(0x4d805e),roadmat=mat(0x343c48,.95),edgeMat=mat(0xf0f3ee),cyan=mat(0x5ce8f2,.35,.25),dark=mat(0x101923),tireMat=mat(0x14171d),glass=mat(0x172f42,.25,.2),red=mat(0xff5c49,.4,.1),white=mat(0xf4f2e9,.4);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1000,1000),grass);ground.rotation.x=-Math.PI/2;ground.position.y=-1.1;ground.receiveShadow=true;scene.add(ground);
const N=440, track=[],width=11;
for(let i=0;i<N;i++){const t=i/N*Math.PI*2;const x=Math.sin(t)*73+Math.sin(3*t)*7;const z=Math.cos(t)*108+Math.sin(2*t)*8;const y=1.4+Math.sin(t*3)*2.3+Math.sin(t*7)*.65;track.push(new THREE.Vector3(x,y,z))}
function frameAt(i){const p=track[(i+N)%N],prev=track[(i+N-1)%N],next=track[(i+1)%N];const tangent=next.clone().sub(prev).normalize();const side=new THREE.Vector3(tangent.z,0,-tangent.x).normalize();return {p,tangent,side}}
function ribbon(offset,material,yoff=0){const verts=[],idx=[];for(let i=0;i<=N;i++){const {p,side}=frameAt(i%N);const c=p.clone();c.y+=yoff;const a=c.clone().addScaledVector(side,offset[0]),b=c.clone().addScaledVector(side,offset[1]);verts.push(a.x,a.y,a.z,b.x,b.y,b.z);if(i<N){const k=i*2;idx.push(k,k+2,k+1,k+1,k+2,k+3)}}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));g.setIndex(idx);g.computeVertexNormals();const m=new THREE.Mesh(g,material);m.receiveShadow=true;m.castShadow=true;scene.add(m);return m}
ribbon([-width/2-1.4,width/2+1.4],edgeMat,.04);ribbon([-width/2,width/2],roadmat,.09);
ribbon([-width/2-.5,-width/2+.1],red,.12);ribbon([width/2-.1,width/2+.5],red,.12);
const dashMat=mat(0xe9f8f8);for(let i=0;i<N;i+=8){const {p,side}=frameAt(i);const g=new THREE.BoxGeometry(.16,.035,2.3);const o=new THREE.Mesh(g,dashMat);o.position.copy(p);o.position.y+=.17;o.castShadow=false;scene.add(o)}
// roadside low-poly scenery
const trunk=mat(0x72513a),leaf=mat(0x2c694f),rockmat=mat(0x7a8790);
for(let i=0;i<105;i++){const k=(i*37+13)%N,{p,side}=frameAt(k);const s=(i%2?1:-1)*(width/2+5+(i%5)*2);const base=p.clone().addScaledVector(side,s);if(i%4===0){const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(1.1+(i%3)*.4,0),rockmat);rock.position.set(base.x,base.y+.5,base.z);rock.rotation.set(i*.4,i,0);scene.add(rock)}else{const h=3+(i%5)*.55;const stem=new THREE.Mesh(new THREE.CylinderGeometry(.16,.28,h*.45,5),trunk);stem.position.set(base.x,base.y+h*.22,base.z);scene.add(stem);const crown=new THREE.Mesh(new THREE.ConeGeometry(1.15+(i%3)*.25,h*.6,5),leaf);crown.position.set(base.x,base.y+h*.62,base.z);crown.rotation.y=i;scene.add(crown)}}
function makeCar(){const car=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(1.75,.48,3.3),red);body.position.y=.65;body.castShadow=true;car.add(body);const hood=new THREE.Mesh(new THREE.BoxGeometry(1.55,.23,1.12),red);hood.position.set(0,.88,1.02);car.add(hood);const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.18,.63,1.35),glass);cabin.position.set(0,1.08,-.35);cabin.castShadow=true;car.add(cabin);const roof=new THREE.Mesh(new THREE.BoxGeometry(1.1,.12,.95),dark);roof.position.set(0,1.43,-.38);car.add(roof);
for(const x of [-.94,.94])for(const z of [-1.05,1.05]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.23,10),tireMat);w.rotation.z=Math.PI/2;w.position.set(x,.42,z);w.castShadow=true;car.add(w);const hub=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.24,8),cyan);hub.rotation.z=Math.PI/2;hub.position.set(x*1.01,.42,z);car.add(hub)}
const spoiler=new THREE.Mesh(new THREE.BoxGeometry(1.8,.12,.25),dark);spoiler.position.set(0,1.25,-1.52);car.add(spoiler);const glow=new THREE.PointLight(0xff4a30,1.4,7);glow.position.set(0,.6,-2);car.add(glow);return car}
const car=makeCar();scene.add(car);
// Start/finish arch and jump pads
const {p:sp,side:ss,tangent:st}=frameAt(0);const arch=new THREE.Group();const polemat=mat(0xe8fbff,.4,.2);for(const x of [-width/2,width/2]){const pole=new THREE.Mesh(new THREE.BoxGeometry(.38,5,.38),polemat);pole.position.set(x,2.5,0);arch.add(pole)}const beam=new THREE.Mesh(new THREE.BoxGeometry(width+.8,.45,.45),cyan);beam.position.y=5;arch.add(beam);arch.position.copy(sp);arch.position.y+=.1;arch.rotation.y=Math.atan2(st.x,st.z);scene.add(arch);
for(const i of [52,155,273,365]){const {p,side,tangent}=frameAt(i);const ramp=new THREE.Mesh(new THREE.BoxGeometry(width-1,.42,7),mat(0xffb74e));ramp.position.copy(p);ramp.position.y+=.3;ramp.rotation.y=Math.atan2(tangent.x,tangent.z);ramp.rotation.x=-.12;scene.add(ramp)}
const input={left:false,right:false,gas:false,brake:false};let running=false,finished=false,progress=0,lateral=0,speed=0,elapsed=0,last=performance.now(),jump=0,lap=0;
function reset(){progress=0;lateral=0;speed=0;elapsed=0;finished=false;lap=0;jump=0;running=true;$('menu').classList.add('hidden');$('lap').textContent='0/1';$('bar').style.width='0%'}
function nearestIndex(pos){let best=0,dist=Infinity;for(let i=0;i<N;i+=2){const d=track[i].distanceToSquared(pos);if(d<dist){dist=d;best=i}}return best}
function placeCar(){const {p,tangent,side}=frameAt(Math.floor(progress)%N);const c=p.clone().addScaledVector(side,lateral);c.y+=.25+jump;car.position.copy(c);car.rotation.y=Math.atan2(tangent.x,tangent.z)-lateral*.012;const look= c.clone().addScaledVector(tangent,9);look.y+=1.4+jump*.35;const desired=c.clone().addScaledVector(tangent,-12);desired.y+=6.5+jump*.5;camera.position.lerp(desired,.09);camera.lookAt(look)}
function clock(t){const m=Math.floor(t/60),s=(t%60).toFixed(1).padStart(4,'0');return String(m).padStart(2,'0')+':'+s}
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.04);last=now;if(running&&!finished){elapsed+=dt;const accel=input.gas?27:input.brake?-42:-8;speed=THREE.MathUtils.clamp(speed+accel*dt,0,74);if(input.brake&&speed>25)speed=Math.max(0,speed-15*dt);const turn=(input.left?-1:0)+(input.right?1:0);lateral+=turn*(3.5+speed*.045)*dt;lateral=THREE.MathUtils.clamp(lateral,-width*.62,width*.62);if(Math.abs(lateral)>width*.49)speed=Math.max(8,speed-28*dt);progress+=speed*dt*.52;const idx=Math.floor(progress)%N;if([52,155,273,365].some(v=>Math.abs(idx-v)<2)&&jump<=0)jump=.01;if(jump>0)jump=Math.max(0,jump+dt*(jump<.8?5:-3));if(progress>=N){finished=true;running=false;lap=1;$('lap').textContent='1/1';$('menu').classList.remove('hidden');$('menu').querySelector('h1').innerHTML='FINISH <span style="color:#6df7ff">!</span>';$('menu').querySelector('p').textContent='完成赛道！用时 '+clock(elapsed)+'。点击重置赛道再挑战一次。';$('start').textContent='再跑一次'}$('bar').style.width=Math.min(100,progress/N*100)+'%'}else speed=Math.max(0,speed-25*dt);placeCar();$('speed').textContent=String(Math.round(speed*3.6)).padStart(3,'0');$('time').textContent=clock(elapsed);renderer.render(scene,camera)}
requestAnimationFrame(animate);$('start').addEventListener('click',reset);$('reset').addEventListener('click',reset);
function key(e,down){const k=e.key.toLowerCase();let name=({'arrowleft':'left','a':'left','arrowright':'right','d':'right','arrowup':'gas','w':'gas',' ':'brake','arrowdown':'brake','s':'brake'})[k];if(name){input[name]=down;e.preventDefault()}}addEventListener('keydown',e=>key(e,true));addEventListener('keyup',e=>key(e,false));document.querySelectorAll('[data-key]').forEach(b=>{const name=b.dataset.key;const down=e=>{e.preventDefault();input[name]=true;b.classList.add('down')},up=e=>{e.preventDefault();input[name]=false;b.classList.remove('down')};b.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,up))});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7))});
placeCar();})();
</script></body></html>
